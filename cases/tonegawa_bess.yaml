layout:
  site_width_m: 150.0
  site_depth_m: 90.0
  setback_m: 3.0
  min_clearance_m: 2.0
  auto_arrange: true
  equipment:
    - {name: 受変電設備, width_m: 18, depth_m: 8, category: 受変電}
    - {name: 主変圧器, width_m: 12, depth_m: 8, category: 受変電}
