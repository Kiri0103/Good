# --- 様式２ 発電設備等の概要 ---
form2:
  access_start: {year: 2025, month: 10, day: 1}
  trial_start: {year: 2026, month: 2, day: 1}
  commercial_start: {year: 2026, month: 6, day: 30}
  desired_voltage_kv: 22.0      # 連系点（受電点）電圧と一致させる
  reserve_line: 有
  reserve_service: Ａ（予備線）
  reserve_contract_kw: 9000.0
  source_type: 太陽光
